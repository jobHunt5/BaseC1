# NOTE (2026-07-20): stale in a couple of places since the Postgres/Supabase
# migration — the live service actually runs on the free plan with no disk
# (DATABASE_URL, not a local SQLite file + DATA_DIR, is what persists data
# now), managed directly in Render's dashboard/API rather than by re-applying
# this blueprint. Kept around for the buildCommand/env var documentation
# value; don't assume plan/disk below matches reality without checking.
services:
  - type: web
    name: areahunt
    runtime: node
    region: oregon
    # Starter (paid) + a persistent disk — the free plan's ephemeral
    # filesystem wipes the SQLite DB (every user account, saved company,
    # and encrypted email password) on every restart/redeploy.
    plan: starter
    # `npx puppeteer browsers install chrome` is required in addition to
    # `npm install` — when Render's build cache reuses node_modules
    # unchanged ("up to date, audited N packages"), npm skips re-running
    # postinstall scripts, so Puppeteer's own Chrome download never re-fires.
    # Its default download location ($HOME/.cache/puppeteer) also isn't part
    # of what Render persists into the running instance either way — see
    # PUPPETEER_CACHE_DIR below, which points it inside the project
    # directory instead. Without both of these, PDF generation
    # (resume/cover letter) fails at runtime with "Could not find Chrome."
    buildCommand: npm install && npx puppeteer browsers install chrome
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: areahunt-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PLACES_PROVIDER
        value: google
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JOB_SEARCH_TIMEOUT_MS
        value: 6000
      - key: ENRICH_LIMIT
        value: 0
      - key: ENRICH_CONCURRENCY
        value: 6
      - key: DEEP_SCAN_CONCURRENCY
        value: 4
      - key: GOOGLE_MAX_PAGES
        value: 3
      - key: GOOGLE_GRID
        value: 2
      - key: GOOGLE_CONCURRENCY
        value: 8
      - key: ENRICH_TIMEOUT_MS
        value: 8000
      - key: FAST_ENRICH_TIMEOUT_MS
        value: 4500
      - key: ENRICH_USER_AGENT
        value: "AreaHuntBot/1.0 (+live job-area scanner)"
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      - key: DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
