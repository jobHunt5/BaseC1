services:
  - type: web
    name: areahunt
    runtime: node
    region: oregon
    # Starter (paid) + a persistent disk — the free plan's ephemeral
    # filesystem wipes the SQLite DB (every user account, saved company,
    # and encrypted email password) on every restart/redeploy.
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: areahunt-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PLACES_PROVIDER
        value: google
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JOB_SEARCH_TIMEOUT_MS
        value: 6000
      - key: ENRICH_LIMIT
        value: 0
      - key: ENRICH_CONCURRENCY
        value: 6
      - key: DEEP_SCAN_CONCURRENCY
        value: 4
      - key: GOOGLE_MAX_PAGES
        value: 3
      - key: GOOGLE_GRID
        value: 2
      - key: GOOGLE_CONCURRENCY
        value: 8
      - key: ENRICH_TIMEOUT_MS
        value: 8000
      - key: FAST_ENRICH_TIMEOUT_MS
        value: 4500
      - key: ENRICH_USER_AGENT
        value: "AreaHuntBot/1.0 (+live job-area scanner)"
