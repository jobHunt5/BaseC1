<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AreaHunt Admin</title>
<link rel="stylesheet" href="/admin.css?v=2">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="icon-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/>
    </symbol>
  </defs>
</svg>

<div class="admin-login-screen" id="loginScreen">
  <div class="admin-login-card">
    <div class="admin-login-logo"><span class="logo-mark"><svg width="14" height="14"><use href="#icon-logo"></use></svg></span>Area<span>Hunt</span> <span class="admin-badge">Admin</span></div>
    <p class="admin-login-hint">Separate from the regular user sign-in. This controls every user's account and the shared scan settings.</p>
    <label class="admin-form-label">Admin password</label>
    <input type="password" id="adminPassword" class="admin-input" placeholder="••••••••" autocomplete="current-password" />
    <div class="admin-login-error" id="loginError" style="display:none"></div>
    <button type="button" class="admin-btn admin-btn-primary" id="loginBtn" onclick="AdminApp.login()">Sign in</button>
  </div>
</div>

<div class="admin-shell hidden" id="adminShell">
  <header class="admin-topbar">
    <div class="admin-login-logo"><span class="logo-mark"><svg width="14" height="14"><use href="#icon-logo"></use></svg></span>Area<span>Hunt</span> <span class="admin-badge">Admin</span></div>
    <nav class="admin-tabs">
      <button type="button" class="admin-tab active" data-tab="overview" onclick="AdminApp.switchTab('overview')">Overview</button>
      <button type="button" class="admin-tab" data-tab="ai" onclick="AdminApp.switchTab('ai')">AI</button>
      <button type="button" class="admin-tab" data-tab="users" onclick="AdminApp.switchTab('users')">Users</button>
      <button type="button" class="admin-tab" data-tab="settings" onclick="AdminApp.switchTab('settings')">Settings</button>
      <button type="button" class="admin-tab" data-tab="audit" onclick="AdminApp.switchTab('audit')">Audit Log</button>
    </nav>
    <button type="button" class="admin-btn admin-btn-outline" onclick="AdminApp.logout()">Sign out</button>
  </header>

  <main class="admin-main">
    <section class="admin-tab-panel" id="panel-overview"></section>
    <section class="admin-tab-panel hidden" id="panel-ai"></section>
    <section class="admin-tab-panel hidden" id="panel-users"></section>
    <section class="admin-tab-panel hidden" id="panel-settings"></section>
    <section class="admin-tab-panel hidden" id="panel-audit"></section>
  </main>
</div>

<!-- User detail drawer -->
<div class="admin-drawer-backdrop" id="drawerBackdrop" onclick="AdminApp.closeUserDrawer(event)"></div>
<div class="admin-drawer" id="userDrawer">
  <div class="admin-drawer-header">
    <div id="drawerTitle">User</div>
    <button type="button" class="admin-drawer-close" onclick="AdminApp.closeUserDrawer()"><svg width="14" height="14"><use href="#icon-close"></use></svg></button>
  </div>
  <div class="admin-drawer-body" id="drawerBody"></div>
</div>

<script src="/industries.js?v=2"></script>
<script src="/adminCharts.js?v=2"></script>
<script src="/admin.js?v=5"></script>
</body>
</html>
